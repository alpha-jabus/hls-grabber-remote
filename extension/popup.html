<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HLS Grabber</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>HLS Grabber</h1>
    <div><button id="downloadsPage" class="link">↓ Загрузки</button><button id="settingsToggle" class="link">⚙ Настройки</button><button id="clear" class="link">Очистить</button></div>
  </header>
  <div class="captureControl">
    <button id="captureToggle" class="primary">Включить перехват на вкладке</button>
    <span id="captureState" class="hint">Перехват выключен</span>
  </div>
  <p class="description">Перехват выключен по умолчанию. Включи его для этой вкладки, затем запусти видео. Firefox попросит доступ к сайтам, включая CDN.</p>
  <div id="summary" class="hint">Проверяю вкладку…</div>
  <label class="field">Название файла<input id="filename" type="text" maxlength="120" placeholder="video"></label>
  <label class="field">Формат<select id="format"><option value="mp4">MP4</option><option value="mkv">MKV (все дорожки)</option></select></label>
  <section id="streams" class="streams"></section>
  <p class="hint">Состояние и очередь загрузок — в отдельной вкладке «↓ Загрузки». <span id="modeLabel"></span></p>
  <div id="message" role="status" aria-live="polite"></div>
  <script src="popup.js"></script>
</body>
</html>
